[project]
name = "troll"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
     "hydra-list-sweeper==1.1.0",
     "hydra-submitit-launcher==1.2.0",
     "torch>=2.2.0,<2.9",
     "torch-memory-saver>=0.0.8",
     "torchvision>=0.22.0",
     "vllm>=0.10.0", # https://github.com/vllm-project/vllm-ascend/issues/2046#issuecomment-3123639101
     "flash-attn",
     "flashinfer-python",
     "verl[vllm]",
     "discrete_trpl",
     "datasets>=2.14.7", # due to pyarrow 0.21 compatibility
     "sandbox",
     "pandas>=2.3.3",
     "debugpy>=1.8.0",
     "ray[default]>=2.9.1",
     "setuptools", # needed for flash-attn build no-isolation
     "wheel", # needed for flash-attn build no-isolation
     "pre-commit>=4.5.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
flash-attn = { git = "https://github.com/Dao-AILab/flash-attention.git" }
verl = { path = "./verl", editable = true  }
discrete_trpl = { path = "./dtrpl", editable = true }
sandbox = { path = "./dependencies/SandboxFusion", editable = true }

[tool.uv.extra-build-dependencies]
xformers = ["torch"]

[tool.uv]
no-build-isolation-package = ["flash-attn"]

